apiVersion: v1
kind: ConfigMap
metadata:
  name: mancala-config
  namespace: default
data:
  OMP_NUM_THREADS: "2"       # moderado en nube (escala horizontal con réplicas)
  MOTOR_PORT: "9000"
  MOTOR_TIMEOUT_S: "30"
  # Actualizar con el dominio real del frontend en producción
  ALLOWED_ORIGINS: "https://mancala.tu-dominio.cloud"