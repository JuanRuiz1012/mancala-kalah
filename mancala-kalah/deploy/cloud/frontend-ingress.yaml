apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: default
  annotations:
    # Ajustar según el Ingress Controller del proveedor (nginx, traefik, etc.)
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - host: mancala.tu-dominio.cloud   # reemplazar con el dominio real cuando se tenga 
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front-svc
                port:
                  number: 80