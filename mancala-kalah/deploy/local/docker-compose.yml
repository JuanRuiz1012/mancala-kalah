services:

  motor:
    build:
      context: ../../motor
      dockerfile: Dockerfile
    container_name: mancala-motor
    environment:
      MOTOR_PORT: "9000"
      OMP_NUM_THREADS: "4"
    ports:
      - "9000:9000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: mancala-backend
    environment:
      MOTOR_URL: "http://motor:9000"
      ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      MOTOR_TIMEOUT_S: "30"
    ports:
      - "8000:8000"
    depends_on:
      motor:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: mancala-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped